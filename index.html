<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勞動筆記 · LABOR NOTES</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Noto Sans TC", sans-serif; 
      color: #171717; 
      background: #f9f8f6; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      -webkit-font-smoothing: antialiased;
    }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #e3ddd6; border-radius: 99px; }

    header { 
      position: sticky; top: 0; z-index: 30; 
      background: rgba(249,248,246,0.85); 
      backdrop-filter: blur(14px) saturate(1.2); 
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border-bottom: 1px solid #ece9e3; 
      padding: 0 24px; 
      height: 64px;
      display: flex; justify-content: space-between; align-items: center; 
    }
    .brand-group { display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 32px; height: 32px; background: #171717; color: white; border-radius: 99px; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
    .brand-text { line-height: 1; }
    .brand-title { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; color: #171717; }
    .brand-sub { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: #8f8a85; margin-top: 2px; }
    
    .search-input { 
      height: 36px; width: 260px; background: #ffffff; border: 1px solid #ece9e3; 
      border-radius: 99px; padding: 0 16px; font-size: 13.5px; outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #d8d2ca; box-shadow: 0 0 0 2px #f0ebe4; }
    .stats-badge { background: #171717; color: white; font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 99px; }

    .app-container { display: flex; flex: 1; max-width: 1180px; width: 100%; margin: 0 auto; overflow: hidden; padding: 24px; gap: 28px; }
    
    /* 左側分類選單 */
    aside { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #ece9e3; border-radius: 14px; overflow: hidden; height: 100%; }
    .aside-header { padding: 16px 20px; border-bottom: 1px solid #ece9e3; font-size: 13px; font-weight: 700; color: #8f8a85; }
    .nav-scroll { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    
    .cat-item { 
      padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #2e2c29; 
      cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; user-select: none;
    }
    .cat-item:hover { background: #f6f5f3; }
    .cat-item.active { background: #2d4a3e; color: #ffffff; font-weight: 700; }
    .cat-count { font-size: 12px; opacity: 0.8; }

    /* 右側清單列表 (列表式卡片佈局) */
    main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 4px; }
    .article-card { background: #ffffff; border: 1px solid #ece9e3; border-radius: 14px; padding: 24px; transition: border-color 0.2s; }
    .article-card:hover { border-color: #cbd5e1; }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .master-badge { font-size: 14px; font-weight: 700; color: #171717; display: flex; align-items: center; gap: 8px; }
    .card-count { font-size: 11px; background: #f4f1ed; color: #8f8a85; padding: 2px 10px; border-radius: 99px; }

    .card-title { font-size: 18px; font-weight: 750; color: #171717; margin-bottom: 8px; line-height: 1.35; }
    .card-excerpt { font-size: 14px; color: #6b6560; line-height: 1.6; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .tag-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .sub-tag { 
      background: #f4f1ed; color: #2a4bd7; border: 1px solid #ece9e3; font-size: 11px; font-weight: 600; 
      padding: 3px 12px; border-radius: 99px; cursor: pointer; user-select: none; transition: all 0.2s; 
    }
    .sub-tag:hover { background: #eef2ff; border-color: #2a4bd7; }

    mark.search-highlight { background-color: #fef08a; color: #854d0e; padding: 1px 4px; border-radius: 4px; font-weight: 600; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; padding: 16px; }
      aside { width: 100%; height: 25vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-group">
      <div class="brand-icon">L</div>
      <div class="brand-text">
        <div class="brand-title">勞動筆記</div>
        <div class="brand-sub">LABOR NOTES</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋關鍵字高亮..." oninput="filterArticles()">
      <div class="stats-badge" id="totalCount">0 NOTES</div>
    </div>
  </header>

  <div class="app-container">
    <aside>
      <div class="aside-header">分類 / 標籤目錄</div>
      <div class="nav-scroll" id="categoryList">
        <div style="text-align: center; color: #9a9590; padding: 20px; font-size: 13px;">載入中...</div>
      </div>
    </aside>

    <main id="contentArea">
      <div style="text-align: center; color: #9a9590; padding: 80px 0; font-size: 14px;">資料載入中...</div>
    </main>
  </div>

  <script>
    let allData = [];
    let currentCategory = 'ALL';
    let currentSearchQuery = '';

    async function loadData() {
      try {
        const res = await fetch(`data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("讀取失敗");
        allData = await res.json();
        
        document.getElementById('totalCount').innerText = `${allData.length} NOTES`;
        renderCategories();
        renderArticles();
      } catch (err) {
        document.getElementById('contentArea').innerHTML = `<div style="color: #ef4444; padding: 16px; font-size: 13px;">⚠️ 無法載入 data.json</div>`;
      }
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderArticles();
    }

    function renderCategories() {
      const catList = document.getElementById('categoryList');
      const counts = {};
      
      let filtered = getSearchData();

      filtered.forEach(item => {
        const m = item.master || '一般條目';
        counts[m] = (counts[m] || 0) + 1;
      });

      let html = `<div class="cat-item ${currentCategory === 'ALL' ? 'active' : ''}" onclick="selectCategory('ALL')">
        <span>全部</span>
        <span class="cat-count">${filtered.length}</span>
      </div>`;

      for (const [master, count] of Object.entries(counts)) {
        const activeClass = currentCategory === master ? 'active' : '';
        html += `<div class="cat-item ${activeClass}" onclick="selectCategory('${master.replace(/'/g, "\\'")}')">
          <span>${master}</span>
          <span class="cat-count">${count}</span>
        </div>`;
      }

      catList.innerHTML = html;
    }

    function getSearchData() {
      if (!currentSearchQuery) return allData;
      return allData.filter(item => {
        const title = (item.title || '').toLowerCase();
        const content = (item.content || '').toLowerCase();
        const tags = Array.isArray(item.tags) ? item.tags.join(' ').toLowerCase() : '';
        return title.includes(currentSearchQuery) || content.includes(currentSearchQuery) || tags.includes(currentSearchQuery);
      });
    }

    function filterArticles() {
      currentSearchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      renderCategories();
      renderArticles();
    }

    function filterByTag(tag) {
      document.getElementById('searchInput').value = tag;
      filterArticles();
    }

    function highlightText(text, query) {
      if (!query || !text) return text;
      const reg = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(reg, '<mark class="search-highlight">$1</mark>');
    }

    function stripMarkdown(md) {
      if (!md) return '';
      return md.replace(/\#+\s/g, '').replace(/\>\s/g, '').replace(/\-\s/g, '');
    }

    function renderArticles() {
      const contentArea = document.getElementById('contentArea');
      let data = getSearchData();

      if (currentCategory !== 'ALL') {
        data = data.filter(item => (item.master || '一般條目') === currentCategory);
      }

      if (data.length === 0) {
        contentArea.innerHTML = `<div style="text-align: center; color: #9a9590; padding: 80px 0; font-size: 14px;">查無相符筆記</div>`;
        return;
      }

      let html = '';
      data.forEach(item => {
        const titleHtml = highlightText(item.title || '無標題', currentSearchQuery);
        const plainExcerpt = stripMarkdown(item.content || '');
        const excerptHtml = highlightText(plainExcerpt, currentSearchQuery);

        const tags = Array.isArray(item.tags) ? item.tags : [];
        const tagsHtml = tags.map(t => `<span class="sub-tag" onclick="filterByTag('${t.replace(/'/g, "\\'")}')"># ${highlightText(t, currentSearchQuery)}</span>`).join('');

        html += `<div class="article-card">
          <div class="card-header">
            <div class="master-badge"><span>👤</span> ${item.master || '勞動筆記'}</div>
          </div>
          <div class="card-title">${titleHtml}</div>
          <div class="card-excerpt">${excerptHtml}</div>
          ${tagsHtml ? `<div class="tag-group">${tagsHtml}</div>` : ''}
        </div>`;
      });

      contentArea.innerHTML = html;
    }

    loadData();
  </script>
</body>
</html>
