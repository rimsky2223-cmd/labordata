<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>勞動筆記 · LABOR NOTES</title><script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Noto Sans TC",sans-serif;color:#171717;background:#f9f8f6;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#dcd6cd;border-radius:99px}header{position:sticky;top:0;z-index:30;background:rgba(249,248,246,.85);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid #ece9e3;padding:0 24px;height:64px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}.brand-group{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}.brand-icon{width:32px;height:32px;background:#171717;color:#fff;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:15px}.brand-title{font-size:14px;font-weight:650}.brand-sub{font-size:10px;letter-spacing:.14em;color:#8f8a85;margin-top:2px}.search-input{height:36px;width:260px;background:#fff;border:1px solid #ece9e3;border-radius:99px;padding:0 16px;font-size:13.5px;outline:none}.stats-badge{background:#171717;color:#fff;font-size:11px;padding:4px 12px;border-radius:99px}.app-container{display:flex;flex:1;max-width:1200px;width:100%;margin:0 auto;overflow:hidden;padding:20px 24px;gap:24px}aside{width:320px;flex-shrink:0;display:flex;flex-direction:column;background:#fff;border:1px solid #ece9e3;border-radius:14px;overflow:hidden;max-height:100%}.aside-header{padding:16px 20px;border-bottom:1px solid #ece9e3;font-size:15px;font-weight:750;display:flex;justify-content:space-between;align-items:center}.nav-scroll{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.group-box{border:1px solid #f1ece6;border-radius:10px;overflow:hidden;background:#faf9f7;flex-shrink:0}.group-title{font-size:14px;font-weight:750;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.group-title:hover{background:#f1ece6}.group-arrow{font-size:10px;color:#8f8a85;transition:.2s}.group-box.open .group-arrow{transform:rotate(90deg)}.group-content{display:none;padding:6px 8px;background:#fff;border-top:1px solid #f1ece6;max-height:520px;overflow-y:auto}.group-box.open .group-content{display:block}.nav-item{padding:9px 12px;border-radius:8px;font-size:13.5px;line-height:1.4;color:#2e2c29;cursor:pointer;display:flex;gap:8px;margin-top:2px}.nav-item:hover{background:#f6f5f3}.nav-item.active{background:#eef2ff;color:#2a4bd7;font-weight:600}.dot{width:5px;height:5px;border-radius:99px;background:#e8e2da;margin-top:7px;flex-shrink:0}.nav-item.active .dot{background:#3b5bff}main{flex:1;overflow-y:auto;background:#fff;border:1px solid #ece9e3;border-radius:14px;display:flex;flex-direction:column}.article-container{padding:36px;flex:1}.article-meta{display:flex;gap:10px;margin-bottom:12px;align-items:center}.master-tag{background:#171717;color:#fff;font-size:11px;padding:2px 10px;border-radius:99px}.updated-date{font-size:11px;color:#a09a94}.article-title{font-size:28px;font-weight:750;line-height:1.25;margin-bottom:16px}.tag-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.sub-tag{background:#f4f1ed;color:#2a4bd7;border:1px solid #ece9e3;font-size:11px;font-weight:600;padding:3px 12px;border-radius:99px;cursor:pointer}.sub-tag:hover{background:#eef2ff;border-color:#2a4bd7}.divider{height:1px;background:#ece9e3;margin-bottom:28px}.markdown-body{font-size:15.5px;line-height:1.85;color:#2a2a2a}.markdown-body h1{font-size:22px;font-weight:700;margin-top:24px;margin-bottom:12px}.markdown-body h2{font-size:19px;font-weight:700;margin-top:28px;padding-top:16px;border-top:1px solid #ece9e3}.markdown-body p{margin:12px 0}.markdown-body ul,.markdown-body ol{padding-left:22px;margin:12px 0}.markdown-body li{margin:6px 0}.markdown-body blockquote{border-left:2.5px solid #171717;padding:8px 16px;background:#faf9f7;border-radius:0 8px 8px 0;margin:16px 0;font-size:14.5px}.markdown-body code{background:#f4f1ed;padding:2px 6px;border-radius:6px;font-size:13.5px;font-family:ui-monospace,SFMono-Regular,monospace}.markdown-body pre{background:#171717;color:#f5f5f5;padding:16px;border-radius:10px;overflow-x:auto;margin:16px 0}.markdown-body pre code{background:none;padding:0;color:inherit}.markdown-body table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px;display:table}.markdown-body thead{background:#faf9f7}.markdown-body th{font-weight:700;text-align:left;padding:10px 14px;border:1px solid #ece9e3;white-space:nowrap;background:#f4f1ed}.markdown-body td{padding:10px 14px;border:1px solid #ece9e3;vertical-align:top}.markdown-body tr:nth-child(even) td{background:#fcfbf9}.markdown-body tr:hover td{background:#f6f5f3}.markdown-body hr{border:none;border-top:1px solid #ece9e3;margin:24px 0}mark.search-highlight{background:#fef08a;color:#854d0e;padding:1px 4px;border-radius:4px;font-weight:600}.media-area{margin-top:40px}.media-label{font-size:11px;letter-spacing:.12em;color:#a09a94;margin-bottom:16px;display:flex;align-items:center;gap:8px}.media-label::before{content:"";width:24px;height:1px;background:#ece9e3}.video-wrap{position:relative;aspect-ratio:16/9;border-radius:14px;border:1px solid #ece9e3;overflow:hidden;background:#111}.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.img-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}.img-grid img{width:100%;border-radius:12px;border:1px solid #ece9e3;object-fit:cover}@media(max-width:768px){.app-container{flex-direction:column;padding:16px}aside{width:100%;height:40vh}.article-container{padding:20px}.markdown-body table{display:block;overflow-x:auto;white-space:nowrap}}</style></head><body>
<header><div class="brand-group" onclick="goHome()"><div class="brand-icon">L</div><div><div class="brand-title">勞動筆記</div><div class="brand-sub">LABOR NOTES</div></div></div><div style="display:flex;gap:12px;align-items:center"><input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋..." oninput="filterArticles()"><div class="stats-badge" id="totalCount">0 NOTES</div></div></header>
<div class="app-container"><aside><div class="aside-header"><span>章節目錄</span><span id="asideCount" style="color:#a09a94;font-size:12px">0 篇</span></div><div class="nav-scroll" id="navList"><div style="text-align:center;color:#9a9590;padding:20px;font-size:13px">載入中...</div></div></aside><main><div class="article-container" id="contentArea"><div style="text-align:center;color:#9a9590;padding:80px 0;font-size:14px">👈 左側選單點擊瀏覽，表格已完美支援</div></div></main></div>
<script>
let allData=[],currentArticleId=null,openGroups=new Set(),currentSearchQuery="";
function escapeHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
if(typeof marked!=='undefined'){marked.setOptions({gfm:true,tables:true,breaks:true,mangle:false,headerIds:false})}
async function loadData(){try{const res=await fetch(`data.json?t=${Date.now()}`);if(!res.ok)throw new Error();allData=await res.json();document.getElementById('totalCount').innerText=`${allData.length} NOTES`;document.getElementById('asideCount').innerText=`${allData.length} 篇`;if(allData.length>0){openGroups.add(allData[0].master||'一般條目');selectArticle(allData[0].id!==undefined?allData[0].id:allData[0].title)}else renderNav(allData)}catch{document.getElementById('navList').innerHTML='<div style="color:#ef4444;padding:16px;font-size:12px">⚠️ 無法載入 data.json</div>'}}
function goHome(){currentSearchQuery="";document.getElementById('searchInput').value="";if(allData.length>0){openGroups.clear();openGroups.add(allData[0].master||'一般條目');selectArticle(allData[0].id!==undefined?allData[0].id:allData[0].title)}else renderNav(allData)}
function toggleGroup(m){if(openGroups.has(m))openGroups.delete(m);else openGroups.add(m);renderNav(getFilteredData())}
function getFilteredData(){if(!currentSearchQuery)return allData;return allData.filter(i=>{const t=(i.title||'').toLowerCase(),c=(i.content||'').toLowerCase(),g=Array.isArray(i.tags)?i.tags.join(' ').toLowerCase():'';return t.includes(currentSearchQuery)||c.includes(currentSearchQuery)||g.includes(currentSearchQuery)})}
function renderNav(data){const nav=document.getElementById('navList');if(!data||!data.length){nav.innerHTML='<div style="text-align:center;color:#9a9590;padding:20px;font-size:13px">沒有符合的筆記</div>';return}const grouped={};data.forEach(i=>{const m=i.master||'一般條目';if(!grouped[m])grouped[m]=[];grouped[m].push(i)});let html='';for(const[master,items]of Object.entries(grouped)){const isOpen=currentSearchQuery?true:openGroups.has(master);html+=`<div class="group-box ${isOpen?'open':''}"><div class="group-title" data-master="${escapeHtml(master)}"><span>${escapeHtml(master)} (${items.length})</span><span class="group-arrow">▶</span></div><div class="group-content">`;items.forEach(item=>{const id=String(item.id!==undefined?item.id:item.title);const active=id===String(currentArticleId)?'active':'';const title=highlightTextSafe(escapeHtml(item.title||'無標題'),currentSearchQuery);html+=`<div class="nav-item ${active}" data-id="${escapeHtml(id)}"><div class="dot"></div><span>${title}</span></div>`});html+='</div></div>'}nav.innerHTML=html;bindNavEvents()}
function bindNavEvents(){document.querySelectorAll('.group-title').forEach(el=>{el.onclick=()=>toggleGroup(el.getAttribute('data-master'))});document.querySelectorAll('.nav-item').forEach(el=>{el.onclick=()=>selectArticle(el.getAttribute('data-id'))})}
function filterArticles(){currentSearchQuery=document.getElementById('searchInput').value.toLowerCase().trim();const filtered=getFilteredData();renderNav(filtered);if(currentArticleId!==null){const ex=filtered.find(a=>String(a.id!==undefined?a.id:a.title)===String(currentArticleId));if(!ex&&filtered.length>0)selectArticle(filtered[0].id!==undefined?filtered[0].id:filtered[0].title,false);else if(ex)highlightCurrentContent()}}
function filterByTag(tag){document.getElementById('searchInput').value=tag;filterArticles()}
function highlightTextSafe(t,q){if(!q||!t)return t;try{const reg=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');return t.replace(reg,'<mark class="search-highlight">$1</mark>')}catch{return t}}
function safeHighlightDom(root,q){if(!q)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);const nodes=[];let n;while(n=walker.nextNode()){if(n.nodeValue.toLowerCase().includes(q.toLowerCase()))nodes.push(n)}const reg=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');nodes.forEach(tn=>{const p=tn.parentNode;if(['MARK','SCRIPT','STYLE'].includes(p.nodeName))return;const frag=document.createDocumentFragment();let last=0;const txt=tn.nodeValue;let m;reg.lastIndex=0;while((m=reg.exec(txt))!==null){if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));const mark=document.createElement('mark');mark.className='search-highlight';mark.textContent=m[0];frag.appendChild(mark);last=m.index+m[0].length}if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));if(frag.childNodes.length)p.replaceChild(frag,tn)})}
function highlightCurrentContent(){if(!currentSearchQuery)return;const body=document.querySelector('.markdown-body');if(body)safeHighlightDom(body,currentSearchQuery)}
function selectArticle(id,auto=true){currentArticleId=String(id);const item=allData.find(a=>String(a.id!==undefined?a.id:a.title)===String(id));if(!item)return;if(auto&&item.master)openGroups.add(item.master);renderNav(getFilteredData());let raw=item.content||'';let html='';if(typeof marked!=='undefined'&&marked.parse){try{html=marked.parse(raw)}catch{html='<p>'+escapeHtml(raw)+'</p>'}}else html='<p>'+escapeHtml(raw)+'</p>';const tags=Array.isArray(item.tags)?item.tags:[];const tagsHtml=tags.map(t=>'<span class="sub-tag" onclick="filterByTag(\''+escapeHtml(t)+'\')"># '+escapeHtml(t)+'</span>').join('');let media='';if(item.youtube){const yid=extractYoutubeId(item.youtube);if(yid)media+='<div class="media-area"><div class="media-label">影音補充 / MEDIA</div><div class="video-wrap"><iframe src="https://www.youtube.com/embed/'+yid+'" allowfullscreen></iframe></div></div>'}const imgs=Array.isArray(item.images)?item.images:[];if(imgs.length)media+='<div class="media-area"><div class="media-label">參考圖檔 / ATTACHMENTS</div><div class="img-grid">'+imgs.map(img=>'<a href="'+escapeHtml(img)+'" target="_blank"><img src="'+escapeHtml(img)+'" alt="圖" loading="lazy" onerror="this.style.display=\'none\'"></a>').join('')+'</div></div>';const updated=item.updatedAt?new Date(item.updatedAt).toLocaleDateString('zh-TW'):'LABOR NOTES';document.getElementById('contentArea').innerHTML='<div class="article-meta"><span class="master-tag">'+escapeHtml(item.master||'勞動筆記')+'</span><span class="updated-date">'+updated+'</span></div><h1 class="article-title">'+escapeHtml(item.title||'無標題')+'</h1>'+(tagsHtml?'<div class="tag-group">'+tagsHtml+'</div>':'')+'<div class="divider"></div><div class="markdown-body">'+html+'</div>'+media;if(currentSearchQuery)setTimeout(highlightCurrentContent,0);document.querySelector('main').scrollTo({top:0,behavior:'smooth'})}
function extractYoutubeId(u){if(!u)return null;const m=u.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);return(m&&m[2].length===11)?m[2]:null}
loadData();
</script></body></html>
